
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Chaos Loom - Technomancy Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020205;
        color: #50ffb0;
        font-family: 'JetBrains Mono', monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      .custom-cursor {
        cursor: crosshair;
      }
      .scanlines::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 100;
        background-size: 100% 4px, 3px 100%;
        pointer-events: none;
        opacity: 0.6;
      }
      .terminal-glow {
        text-shadow: 0 0 10px rgba(80, 255, 176, 0.8), 0 0 20px rgba(80, 255, 176, 0.3);
      }
      .rune-border {
        border: 1px solid rgba(80, 255, 176, 0.2);
        box-shadow: inset 0 0 20px rgba(80, 255, 176, 0.05);
        clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%);
      }
      .cyber-scroll {
        scrollbar-width: thin;
        scrollbar-color: #50ffb0 transparent;
      }
      .cyber-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .cyber-scroll::-webkit-scrollbar-thumb {
        background: #50ffb0;
      }
      @keyframes rune-flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .animate-rune {
        animation: rune-flicker 3s infinite ease-in-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "tone": "https://esm.sh/tone@^15.1.22",
    "p5": "https://esm.sh/p5@^1.9.0"
  }
}
</script>
</head>
  <body class="scanlines">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
